# One round of the stock check; check.yml runs up to 16 of them on one machine. A round waits for its turn (one starts
# every ROUND_SECONDS at most), stops if a newer check is ready to take over, starts the next check at round
# START_NEXT_AT, then checks the stores, saves the state and publishes the dashboard.
name: Check round
description: One round of the iPhone Duo stock check
inputs:
  n:
    description: Round number, from 1
    required: true
  secrets:
    description: The TRACKER_SECRETS secret
    required: true
runs:
  using: composite
  steps:
    - name: Wait for this round's turn
      id: turn
      shell: bash
      env:
        N: ${{ inputs.n }}
      run: |
        runs="repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?per_page=30"
        if [ "$N" -gt 1 ]; then
          # A newer check that already has its machine is waiting for this one: stop, and it carries on. Scheduled
          # starts don't count: they stop by themselves while a check is running (28 Oct 21:57 both stopped).
          ready=$(gh api "$runs" --jq "[.workflow_runs[] | select(.display_title == \"Stock check\" and .status == \"in_progress\" and .event != \"schedule\" and .id > $GITHUB_RUN_ID)] | length") || ready=0
          # Only a plain number counts; anything else (an error text) means "don't know", so keep checking.
          case "$ready" in ''|*[!0-9]*) ready=0 ;; esac
          if [ "$ready" != "0" ]; then
            echo "A newer check is ready; it carries on from here."; touch handed-over.flag
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wait=$(( $(cat .round-start 2>/dev/null || echo 0) + ROUND_SECONDS - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
        fi
        # Start the next check now, so it gets its machine while this one keeps checking.
        if [ "$N" = "$START_NEXT_AT" ]; then
          queued=$(gh api "$runs" --jq "[.workflow_runs[] | select(.display_title == \"Stock check\" and .status != \"completed\" and .event != \"schedule\" and .id > $GITHUB_RUN_ID)] | length") || queued=1
          case "$queued" in ''|*[!0-9]*) queued=1 ;; esac
          if [ "$queued" = "0" ]; then gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref main -f test=false || true
          else echo "A newer check is already on its way."; fi
        fi
        date +%s > .round-start
        echo "go=true" >> "$GITHUB_OUTPUT"

    - name: Check the stores
      id: check
      if: steps.turn.outputs.go == 'true'
      shell: powershell
      env:
        TRACKER_SECRETS: ${{ inputs.secrets }}
      run: ./tracker.ps1 -Quiet

    # One orphan commit, force-pushed, so the data branch never grows.
    - name: Save state
      if: steps.turn.outputs.go == 'true' && !cancelled()
      shell: bash
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        export GIT_INDEX_FILE="$RUNNER_TEMP/state-index"
        for f in state.json history.json health.json bot.json tracker.log; do [ -f "$f" ] && git add -f "$f"; done
        commit=$(git commit-tree "$(git write-tree)" -m 'Tracker state')
        git push -q -f origin "$commit:refs/heads/data"

    - name: Prepare the page
      if: steps.check.outcome == 'success'
      shell: bash
      run: |
        rm -rf _site && mkdir -p _site
        cp dashboard.html _site/index.html
        if [ -d logos ]; then cp -r logos _site/; fi

    # Each round needs its own artifact name within the run.
    - id: upload
      if: steps.check.outcome == 'success'
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
        name: github-pages-${{ inputs.n }}

    # Published through GitHub's Pages deployment API (what actions/deploy-pages does) with a build version unique to
    # this round. deploy-pages always uses the commit as the version: after hours of deploys of one commit, Pages kept
    # serving an old copy (29 Oct 16:36 to 30 Oct 23:34) while every deploy reported success.
    - name: Publish the page
      if: steps.check.outcome == 'success'
      shell: powershell
      env:
        N: ${{ inputs.n }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
      run: |
        $ErrorActionPreference = 'Stop'; $ProgressPreference = 'SilentlyContinue'
        $oidc = (Invoke-RestMethod -Uri $env:ACTIONS_ID_TOKEN_REQUEST_URL -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
        Write-Host "::add-mask::$oidc"
        $version = "$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:N"
        $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
        $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pages/deployments"
        $body = @{ artifact_id = [long]$env:ARTIFACT_ID; pages_build_version = $version; oidc_token = $oidc } | ConvertTo-Json -Compress
        $d = Invoke-RestMethod -Method Post -Uri $api -Headers $h -ContentType 'application/json' -Body $body
        for ($i = 0; $i -lt 30; $i++) {
          Start-Sleep -Seconds 2
          $s = (Invoke-RestMethod -Uri "$api/$($d.id)" -Headers $h).status
          if ($s -eq 'succeed') { Write-Host "Published (build version $version)."; exit 0 }
          if ($s -match 'fail|error|cancel|lost') { throw "Pages deployment $version ended as '$s'." }
        }
        throw "Pages deployment $version was still '$s' after 60 seconds."
