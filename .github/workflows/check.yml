# Checks the UAE stores, sends Telegram/WhatsApp/phone alerts (TRACKER_SECRETS secret, made by publish.ps1 -CopySecret),
# keeps state on the "data" branch and publishes the dashboard to GitHub Pages. Each check starts the next one about
# 2 minutes after it began; the 5-minute schedule (which GitHub runs only every 30-60 minutes) restarts that chain if
# it ever stops. The "gate" job keeps checks one at a time and cancels a check that hangs, instead of a concurrency
# group (on 27 Oct a check waiting in that group never started, which stopped the chain).
name: Stock check
run-name: ${{ inputs.test && 'Test alerts' || 'Stock check' }}

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send test alerts instead of checking
        type: boolean
        default: false
      channels:
        description: Test which alerts (a phone call uses Twilio credit)
        type: choice
        options: [telegram, telegram+whatsapp, telegram+whatsapp+call]
        default: telegram
      count:
        description: How many tests (1-10)
        type: number
        default: 1
      gap:
        description: Minutes between tests
        type: number
        default: 2

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  test:
    if: inputs.test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Send test alerts
        shell: powershell
        env:
          TRACKER_SECRETS: ${{ secrets.TRACKER_SECRETS }}
          TEST_CHANNELS: ${{ inputs.channels }}
          TEST_COUNT: ${{ inputs.count }}
          TEST_GAP: ${{ inputs.gap }}
        run: |
          $n = [Math]::Max(1, [Math]::Min(10, [int]$env:TEST_COUNT))
          $gap = [Math]::Max(1, [Math]::Min(10, [int]$env:TEST_GAP))
          for ($i = 1; $i -le $n; $i++) {
            $env:TRACKER_TEST_LABEL = $(if ($n -gt 1) { "test $i of $n" } else { '' })
            ./tracker.ps1 -TestTelegram
            if ($env:TEST_CHANNELS -match 'whatsapp') { ./tracker.ps1 -TestWhatsApp }
            if ($env:TEST_CHANNELS -match 'call') { ./tracker.ps1 -TestCall }
            if ($i -lt $n) { Start-Sleep -Seconds (60 * $gap) }
          }

  # One check at a time: a newer check waits here until older ones finish, and an older one still not finished
  # 12 minutes after it was created (a normal one takes about 3; GitHub sometimes leaves a run waiting forever) is
  # cancelled. Test alerts ("Test alerts" runs) never wait or count.
  gate:
    if: ${{ !inputs.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go: ${{ steps.wait.outputs.go }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 96); do
            older=$(gh run list -R "$GITHUB_REPOSITORY" -w check.yml -L 30 --json databaseId,status,displayTitle,createdAt \
              --jq "[.[] | select(.displayTitle == \"Stock check\" and .status != \"completed\" and .databaseId < $GITHUB_RUN_ID)]")
            if [ "$(echo "$older" | jq length)" = "0" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            cut=$(date -u -d '-12 min' +%Y-%m-%dT%H:%M:%SZ); hung=$(date -u -d '-20 min' +%Y-%m-%dT%H:%M:%SZ)
            for id in $(echo "$older" | jq -r --arg cut "$cut" '.[] | select(.createdAt < $cut) | .databaseId'); do
              echo "Run $id is still not finished after 12 minutes: cancelling it."; gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
            done
            for id in $(echo "$older" | jq -r --arg cut "$hung" '.[] | select(.createdAt < $cut) | .databaseId'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true
            done
            sleep 10
          done
          echo "Older checks are still running after 16 minutes; this one stops."; echo "go=false" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: ${{ !inputs.test && needs.gate.outputs.go == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Note the start time
        id: start
        shell: bash
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Restore saved state
        shell: bash
        run: |
          if git fetch -q --depth 1 origin data 2>/dev/null; then git checkout FETCH_HEAD -- . && git reset -q; fi

      # Times in alerts, the log and delivery dates are UAE time.
      - name: Use UAE time
        shell: powershell
        run: tzutil /s "Arabian Standard Time"

      - name: Check the stores
        id: check
        shell: powershell
        env:
          TRACKER_SECRETS: ${{ secrets.TRACKER_SECRETS }}
        run: ./tracker.ps1 -Quiet

      # One orphan commit, force-pushed, so the data branch never grows.
      - name: Save state
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="$RUNNER_TEMP/state-index"
          for f in state.json history.json health.json tracker.log; do [ -f "$f" ] && git add -f "$f"; done
          commit=$(git commit-tree "$(git write-tree)" -m 'Tracker state')
          git push -q -f origin "$commit:refs/heads/data"

      - name: Prepare the page
        if: steps.check.outcome == 'success'
        shell: bash
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          if [ -d logos ]; then cp -r logos _site/; fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outcome == 'success'
        with:
          path: _site

      - id: deploy
        if: steps.check.outcome == 'success'
        uses: actions/deploy-pages@v4

      # A check already queued after this one (Run check now, the schedule) carries the chain on instead, so extra
      # starts never make a second chain.
      - name: Start the next check
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.start.outputs.at }}
        run: |
          wait=$(( 115 - ($(date +%s) - STARTED) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          newer=$(gh run list -R "$GITHUB_REPOSITORY" -w check.yml -L 30 --json databaseId,status,displayTitle \
            --jq "[.[] | select(.displayTitle == \"Stock check\" and .status != \"completed\" and .databaseId > $GITHUB_RUN_ID)] | length")
          if [ "$newer" = "0" ]; then gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref main -f test=false
          else echo "A newer check is already queued; it carries the chain on."; fi
