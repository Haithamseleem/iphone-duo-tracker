# Checks the UAE stores, sends Telegram/WhatsApp/phone alerts (TRACKER_SECRETS secret, made by publish.ps1 -CopySecret),
# keeps state on the "data" branch and publishes the dashboard to GitHub Pages. One machine checks in rounds, about one
# a minute, and starts the next check partway through, so GitHub's occasional 2-8 minute wait for a Windows machine
# no longer leaves a gap (see the check job). The 5-minute schedule (which GitHub runs only every 30-60 minutes)
# restarts that chain if it ever stops. No concurrency group: on 27 Oct a check waiting in one never started.
name: Stock check
run-name: ${{ inputs.test && 'Test alerts' || 'Stock check' }}

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send test alerts instead of checking
        type: boolean
        default: false
      channels:
        description: Test which alerts (a phone call uses Twilio credit)
        type: choice
        options: [telegram, telegram+whatsapp, telegram+whatsapp+call]
        default: telegram
      count:
        description: How many tests (1-10)
        type: number
        default: 1
      gap:
        description: Minutes between tests
        type: number
        default: 2

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  test:
    if: inputs.test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Send test alerts
        shell: powershell
        env:
          TRACKER_SECRETS: ${{ secrets.TRACKER_SECRETS }}
          TEST_CHANNELS: ${{ inputs.channels }}
          TEST_COUNT: ${{ inputs.count }}
          TEST_GAP: ${{ inputs.gap }}
        run: |
          $n = [Math]::Max(1, [Math]::Min(10, [int]$env:TEST_COUNT))
          $gap = [Math]::Max(1, [Math]::Min(10, [int]$env:TEST_GAP))
          for ($i = 1; $i -le $n; $i++) {
            $env:TRACKER_TEST_LABEL = $(if ($n -gt 1) { "test $i of $n" } else { '' })
            ./tracker.ps1 -TestTelegram
            if ($env:TEST_CHANNELS -match 'whatsapp') { ./tracker.ps1 -TestWhatsApp }
            if ($env:TEST_CHANNELS -match 'call') { ./tracker.ps1 -TestCall }
            if ($i -lt $n) { Start-Sleep -Seconds (60 * $gap) }
          }

  # One machine checks in rounds (.github/actions/round): one starts every ROUND_SECONDS at most, up to 16. At round
  # START_NEXT_AT it starts the next check, which gets its own machine while this one keeps going; once that one is
  # ready, this one stops after its current round and the new one carries on from the saved state. Test alerts
  # ("Test alerts" runs) never wait or count.
  check:
    if: ${{ !inputs.test }}
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: https://haithamseleem.github.io/iphone-duo-tracker/
    env:
      GH_TOKEN: ${{ github.token }}
      ROUND_SECONDS: 60
      START_NEXT_AT: 6
    steps:
      - uses: actions/checkout@v4

      # One check at a time (rules in .github/scripts/runs.sh, tested by the "Test chain script" workflow): this one
      # waits while an older one is working, and stops if a newer one already has its machine. A scheduled start, or a
      # check that waited over 30 minutes for a machine, takes over only when no other check is running or on its way.
      # A check whose job has done nothing for 12 minutes is hung and is cancelled.
      - name: Wait for the previous check
        id: wait
        shell: bash
        run: bash .github/scripts/runs.sh wait

      # Without the saved state every in-stock store would look new (repeat alerts and calls) and the history would be
      # lost, so a failed fetch stops this check instead; the last step then starts the next one. Only a missing data
      # branch (the very first run) starts fresh.
      - name: Restore saved state
        if: steps.wait.outputs.go == 'true'
        shell: bash
        run: |
          for i in 1 2 3; do
            if git fetch -q --depth 1 origin data; then git checkout FETCH_HEAD -- . && git reset -q; exit 0; fi
            rc=0; git ls-remote --exit-code origin refs/heads/data > /dev/null || rc=$?
            if [ "$rc" = "2" ]; then echo "No saved state yet (first run)."; exit 0; fi
            sleep 5
          done
          echo "::error::Couldn't fetch the saved state from the data branch, so this check stops; the next one is started."
          exit 1

      # Times in alerts, the log and delivery dates are UAE time.
      - name: Use UAE time
        if: steps.wait.outputs.go == 'true'
        shell: powershell
        run: tzutil /s "Arabian Standard Time"

      # A round that fails doesn't stop the next one. After a handover (handed-over.flag) the rest are skipped.
      - { name: Round 1, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 1, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 2, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 2, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 3, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 3, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 4, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 4, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 5, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 5, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 6, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 6, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 7, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 7, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 8, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 8, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 9, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 9, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 10, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 10, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 11, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 11, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 12, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 12, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 13, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 13, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 14, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 14, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 15, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 15, secrets: "${{ secrets.TRACKER_SECRETS }}" } }
      - { name: Round 16, if: "steps.wait.outputs.go == 'true' && hashFiles('handed-over.flag') == ''", continue-on-error: true, uses: ./.github/actions/round, with: { n: 16, secrets: "${{ secrets.TRACKER_SECRETS }}" } }

      # After round 16 (or a failed restore) without a handover, make sure a next check is coming: one already running,
      # or one started within the last 10 minutes that is still waiting for a machine. Otherwise start one.
      - name: Make sure the next check is coming
        if: ${{ steps.wait.outputs.go == 'true' && !cancelled() && hashFiles('handed-over.flag') == '' }}
        shell: bash
        run: |
          next=$(bash .github/scripts/runs.sh next)
          case "$next" in ''|*[!0-9]*) next=0 ;; esac
          if [ "$next" = "0" ]; then gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref main -f test=false
          else echo "The next check is on its way."; fi
