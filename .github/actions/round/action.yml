# One round of the stock check; check.yml runs up to 16 of them on one machine. A round waits for its turn (one starts
# every ROUND_SECONDS at most), stops if a newer check is ready to take over, starts the next check at round
# START_NEXT_AT, then checks the stores, saves the state and publishes the dashboard.
name: Check round
description: One round of the iPhone Duo stock check
inputs:
  n:
    description: Round number, from 1
    required: true
  secrets:
    description: The TRACKER_SECRETS secret
    required: true
runs:
  using: composite
  steps:
    - name: Wait for this round's turn
      id: turn
      shell: bash
      env:
        N: ${{ inputs.n }}
      run: |
        if [ "$N" -gt 1 ]; then
          # A newer check has its machine, has checked out and is waiting for this one: stop, and it carries on
          # (.github/scripts/runs.sh; scheduled starts never count). Anything but 1 means keep checking.
          ready=$(bash .github/scripts/runs.sh ready) || ready=0
          if [ "$ready" = "1" ]; then
            echo "A newer check is ready; it carries on from here."; touch handed-over.flag
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wait=$(( $(cat .round-start 2>/dev/null || echo 0) + ROUND_SECONDS - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
        fi
        # Start the next check now, so it gets its machine while this one keeps checking.
        if [ "$N" = "$START_NEXT_AT" ]; then
          queued=$(bash .github/scripts/runs.sh pending) || queued=err
          case "$queued" in ''|*[!0-9]*) queued=1 ;; esac
          if [ "$queued" = "0" ]; then gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref main -f test=false || true
          else echo "A newer check is already on its way."; fi
        fi
        date +%s > .round-start
        echo "go=true" >> "$GITHUB_OUTPUT"

    - name: Check the stores
      id: check
      if: steps.turn.outputs.go == 'true'
      shell: powershell
      env:
        TRACKER_SECRETS: ${{ inputs.secrets }}
      run: ./tracker.ps1 -Quiet

    # One orphan commit, force-pushed, so the data branch never grows. Its id is also this round's Pages build version.
    - name: Save state
      id: save
      if: steps.turn.outputs.go == 'true' && !cancelled()
      shell: bash
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        export GIT_INDEX_FILE="$RUNNER_TEMP/state-index"
        for f in state.json history.json health.json bot.json pages.json tracker.log; do [ -f "$f" ] && git add -f "$f"; done
        commit=$(git commit-tree "$(git write-tree)" -m 'Tracker state')
        git push -q -f origin "$commit:refs/heads/data"
        echo "sha=$commit" >> "$GITHUB_OUTPUT"

    - name: Prepare the page
      if: steps.check.outcome == 'success'
      shell: bash
      run: |
        rm -rf _site && mkdir -p _site
        cp dashboard.html _site/index.html
        if [ -d logos ]; then cp -r logos _site/; fi

    # Each round needs its own artifact name within the run.
    - id: upload
      if: steps.check.outcome == 'success'
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
        name: github-pages-${{ inputs.n }}

    # Published through GitHub's Pages deployment API (what actions/deploy-pages does) with a build version unique to
    # this round: the data-branch commit just saved (the API wants a commit id; any other string gets a 404).
    # deploy-pages always uses the workflow's commit: after hours of deploys of one commit, Pages kept serving an old
    # copy (29 Oct 16:36 to 30 Oct 23:34) while every deploy reported success. There is deliberately no fallback to
    # that version. pages.json counts failed publishes in a row (saved with the state next round), and tracker.ps1
    # sends a self-check alert after 5.
    - name: Publish the page
      if: steps.check.outcome == 'success'
      shell: powershell
      env:
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        STATE_SHA: ${{ steps.save.outputs.sha }}
      run: |
        $ErrorActionPreference = 'Stop'; $ProgressPreference = 'SilentlyContinue'
        $pages = @{ fails = 0; error = ''; ok = $null }
        try { $old = Get-Content pages.json -Raw | ConvertFrom-Json; $pages.fails = [int]$old.fails; $pages.ok = $old.ok } catch { }
        try {
          if ($env:STATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'No saved-state commit this round to use as the build version.' }
          $version = $env:STATE_SHA
          $oidc = (Invoke-RestMethod -Uri $env:ACTIONS_ID_TOKEN_REQUEST_URL -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
          Write-Host "::add-mask::$oidc"
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pages/deployments"
          $body = @{ artifact_id = [long]$env:ARTIFACT_ID; pages_build_version = $version; oidc_token = $oidc } | ConvertTo-Json -Compress
          $d = Invoke-RestMethod -Method Post -Uri $api -Headers $h -ContentType 'application/json' -Body $body
          $s = ''
          for ($i = 0; $i -lt 30 -and $s -ne 'succeed'; $i++) {
            Start-Sleep -Seconds 2
            $s = (Invoke-RestMethod -Uri "$api/$($d.id)" -Headers $h).status
            if ($s -match 'fail|error|cancel|lost') { throw "Pages deployment ended as '$s'." }
          }
          if ($s -ne 'succeed') { throw "Pages deployment was still '$s' after 60 seconds." }
          $pages = @{ fails = 0; error = ''; ok = (Get-Date).ToString('o') }
          Write-Host "Published (build version $version)."
        } catch {
          $msg = if ($_.ErrorDetails -and $_.ErrorDetails.Message) { $_.ErrorDetails.Message } else { $_.Exception.Message }
          $pages.fails++; $pages.error = "$msg".Substring(0, [Math]::Min(200, "$msg".Length))
          Write-Host "::warning::Publishing the page failed ($($pages.fails) in a row): $($pages.error)"
        }
        $pages | ConvertTo-Json | Set-Content pages.json -Encoding UTF8
        if ($pages.fails) { exit 1 }
